name: easy_svn
description: "Git client MVP — Clone, Pull, Push with GitHub OAuth2, powered by libgit2."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (repo metadata, settings)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path: ^1.9.0

  # Auth: OAuth2 PKCE + secure token storage + deep links
  flutter_secure_storage: ^9.2.4
  app_links: ^6.4.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  http: ^1.2.2

  # File system
  path_provider: ^2.1.5

  # Network status
  connectivity_plus: ^6.1.3

  # Repo list swipe actions (plan §4 W10)
  flutter_slidable: ^3.1.1

  # FFI
  ffi: ^2.1.3
  git2_bridge:
    path: packages/git2_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

  build_runner: ^2.4.13
  drift_dev: ^2.22.1

# path_provider_android >=2.2.18 rewrote its Android implementation on
# top of package:jni, whose android/build.gradle (still true as of jni
# 1.0.1, the latest release) isn't compatible with the AGP 9.0.1 /
# Kotlin 2.3.20 this project's `flutter create` template pinned —
# Gradle fails evaluating the :jni subproject with "Could not find
# method kotlin() ...". Pin back to the last pre-jni release until
# upstream fixes it; see CI run 30238338344 for the original failure.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
