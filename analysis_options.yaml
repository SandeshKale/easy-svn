# Comprehensive lint set: very_good_analysis layers ~150 additional rules
# on top of package:lints/flutter_lints (strict-casts/strict-inference,
# cancel_subscriptions, close_sinks, avoid_dynamic_calls, sorting,
# documentation, etc). See https://pub.dev/packages/very_good_analysis.
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # This is app code, not a published package — requiring a doc
    # comment on every public class/member (screens, providers, table
    # columns) is noise here. Kept enabled in packages/git2_bridge,
    # which *is* a reusable API surface.
    public_member_api_docs: false
    # Drift's generated tables intentionally expose mutable-looking
    # column getters (`IntColumn get id => ...`); flagging every use
    # site of `Table`/`Companion` types instead adds nothing.
    diagnostic_describe_all_properties: false
    # Relative imports within this app's own lib/ are the more common
    # convention and read better across nested feature folders than
    # `package:easy_svn/...` everywhere; still required (and used)
    # across the package boundary into packages/git2_bridge.
    always_use_package_imports: false
    prefer_relative_imports: true
    # Grouping pubspec dependencies by purpose (see the comments in
    # pubspec.yaml) is more useful here than strict alphabetical order.
    sort_pub_dependencies: false
    # Chaining calloc.free/etc. as a cascade reads worse than the
    # explicit repeated-receiver form used throughout git2_bridge.dart.
    cascade_invocations: false

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/*.g.dart'
    - 'packages/git2_bridge/lib/src/git2_bridge_bindings_generated.dart'
